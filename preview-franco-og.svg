<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo gradiente -->
  <defs>
    <linearGradient id="gradFondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3b7d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4267b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#gradFondo)"/>
  
  <!-- Decoración dorada superior -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#d4af37" stroke-width="4"/>
  
  <!-- Diploma SVG centrado -->
  <g transform="translate(600, 150)">
    <g stroke="#d4af37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -40 60 Q -20 -20 0 -60"/>
      <path d="M 0 -60 L 30 -30 L 45 -20 L 70 -60 Q 85 -75 95 -55 L 70 -20 Q 50 0 30 15"/>
      <rect x="10" y="-50" width="60" height="45" rx="5" transform="rotate(-25 40 -27)"/>
      <path d="M 15 -30 Q 25 -40 35 -30"/>
      <path d="M 25 -20 Q 35 -30 45 -20"/>
    </g>
  </g>
  
  <!-- Título principal -->
  <text x="600" y="340" font-family="'Montserrat', sans-serif" font-size="52" font-weight="600" fill="#5a7ec4" text-anchor="middle" letter-spacing="2" text-transform="uppercase">
    VAMOS A CELEBRAR
  </text>
  
  <text x="600" y="400" font-family="'Montserrat', sans-serif" font-size="52" font-weight="600" fill="#5a7ec4" text-anchor="middle" letter-spacing="2" text-transform="uppercase">
    MI GRADUACIÓN
  </text>
  
  <!-- Nombre -->
  <text x="600" y="500" font-family="'Montserrat', sans-serif" font-size="48" font-weight="600" fill="white" text-anchor="middle">
    Cr. Franco Martínez
  </text>
  
  <!-- Fecha y hora -->
  <text x="600" y="560" font-family="'Montserrat', sans-serif" font-size="28" font-weight="500" fill="#d4af37" text-anchor="middle">
    3 de octubre • 19:00 hs
  </text>
  
  <!-- Decoración dorada inferior -->
  <line x1="100" y1="600" x2="1100" y2="600" stroke="#d4af37" stroke-width="4"/>
</svg>
