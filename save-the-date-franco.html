<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Franco</title>
    
    <!-- Open Graph para WhatsApp, Facebook, etc -->
    <meta property="og:title" content="Graduación Cr. Franco Martínez">
    <meta property="og:description" content="SAVE THE DATE">
    <meta property="og:image" content="https://github.com/fraan94/franco-graduacion/preview-franco.svg">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Graduación Cr. Franco Martínez">
    <meta name="twitter:description" content="SAVE THE DATE">
    <meta name="twitter:image" content="https://github.com/fraan94/franco-graduacion/preview-franco.svg">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fafbfc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 60px 45px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(66, 103, 178, 0.08);
            border: 1px solid #e8eef5;
        }
        
        .content {
            text-align: center;
        }
        
        .save-the-date {
            color: #5a7ec4;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            color: #2d3b7d;
            font-size: 52px;
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.1;
        }
        
        .subtitle {
            color: #7a8bc4;
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.6;
            font-family: 'Montserrat', sans-serif;
        }
        
        .countdown-container {
            background: linear-gradient(135deg, #fafbfc 0%, #f5f8ff 100%);
            border: 1px solid #e8eef5;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 35px;
        }
        
        .countdown-label {
            color: #d4af37;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        
        .countdown-items {
            display: flex;
            justify-content: space-around;
            gap: 12px;
        }
        
        .countdown-item {
            flex: 1;
            text-align: center;
        }
        
        .countdown-number {
            color: #d4af37;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            line-height: 1;
            margin-bottom: 6px;
        }
        
        .countdown-text {
            color: #7a8bc4;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 35px 0;
        }
        
        .event-details {
            margin-bottom: 35px;
        }
        
        .event-detail-item {
            margin-bottom: 20px;
        }
        
        .event-label {
            color: #d4af37;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .event-value {
            color: #2d3b7d;
            font-size: 18px;
            font-weight: 500;
            font-family: 'Montserrat', sans-serif;
        }
        
        .buttons-container {
            display: flex;
            gap: 12px;
            flex-direction: column;
            margin-top: 35px;
        }
        
        .btn {
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .btn-google {
            background: #4267b2;
            color: white;
            border: 1px solid #4267b2;
        }
        
        .btn-google:hover {
            background: #2d3b7d;
            border-color: #2d3b7d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 103, 178, 0.2);
        }
        
        .btn-apple {
            background: white;
            color: #4267b2;
            border: 1.5px solid #4267b2;
        }
        
        .btn-apple:hover {
            background: #f5f8ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 103, 178, 0.12);
        }
        
        .footer-text {
            color: #9aabce;
            font-size: 11px;
            margin-top: 18px;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 45px 30px;
            }
            
            h1 {
                font-size: 42px;
            }
            
            .event-value {
                font-size: 16px;
            }
            
            .countdown-number {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="save-the-date">Save the date</div>
            
            <h1>Cr. Franco<br>Martínez</h1>
            
            <p class="subtitle">Celebra conmigo mi graduación</p>
            
            <div class="countdown-container">
                <div class="countdown-label">Faltan</div>
                <div class="countdown-items">
                    <div class="countdown-item">
                        <div class="countdown-number" id="days">0</div>
                        <div class="countdown-text">Días</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="hours">0</div>
                        <div class="countdown-text">Horas</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="minutes">0</div>
                        <div class="countdown-text">Minutos</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="seconds">0</div>
                        <div class="countdown-text">Segundos</div>
                    </div>
                </div>
            </div>
            
            <div class="divider-line"></div>
            
            <div class="event-details">
                <div class="event-detail-item">
                    <div class="event-label">Fecha</div>
                    <div class="event-value">Sábado 3 de octubre de 2026</div>
                </div>
                <div class="event-detail-item">
                    <div class="event-label">Hora</div>
                    <div class="event-value">19:00</div>
                </div>
            </div>
            
            <div class="divider-line"></div>
            
            <div class="buttons-container">
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Graduación+Cr.+Franco+Martínez+🎓&dates=20261003T190000Z/20261003T190000Z&details=¡Celebrá+con+Franco+su+recibida!" class="btn btn-google">
                    Agregar a Google Calendar
                </a>
                <a href="Graduacion_Franco.ics" download class="btn btn-apple">
                    Agregar a Calendario (iOS)
                </a>
            </div>
            
            <p class="footer-text">Elige tu calendario preferido</p>
        </div>
    </div>
    
    <script>
        function updateCountdown() {
            // Fecha y hora del evento: 3 de octubre de 2026 a las 19:00 (zona horaria Uruguay UTC-3)
            // Creamos la fecha en la zona horaria correcta
            const eventDate = new Date('2026-10-03T19:00:00-03:00').getTime();
            const now = new Date().getTime();
            const difference = eventDate - now;
            
            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;
            } else {
                // Si el evento ya pasó, mostrar 0 en todo
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
            }
        }
        
        // Actualizar el countdown inmediatamente y luego cada segundo
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
